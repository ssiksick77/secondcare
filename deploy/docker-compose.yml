# SECONDCare on a shared Linux server, one user account, no root.
# From the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Before the first start (docs/서버_이전_2026-11-04.md):
#   mkdir -m 700 -p ~/secondcare/data ~/secondcare/tailscale
#   fill ~/secondcare/data: <ledger>.sqlite, .env, google_client_secret.json, google_token.json
#   echo TS_AUTHKEY=tskey-auth-... > deploy/.env   (gitignored)
# No port reaches the host: the app shares the tailscale container's network
# namespace and `tailscale serve` (serve.json) publishes 127.0.0.1:8791 to the
# tailnet as https://secondcare.<tailnet>.ts.net. Users get the node by
# Tailscale node sharing (docs/서버_이전_2026-11-04.md, 4 and 6).
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: secondcare-tailscale
    hostname: secondcare
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}          # issued for tag:secondcare (deploy/.env)
      TS_HOSTNAME: secondcare
      TS_EXTRA_ARGS: --advertise-tags=tag:secondcare
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${HOME}/secondcare/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  secondcare:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: secondcare
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      LEDGER_DB: /data/의료인공지능센터_지출장부_2026.sqlite
    volumes:
      - ${HOME}/secondcare/data:/data
