<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증빙 관리 · 2026 의료인공지능센터 회계대장</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfcfd; --line:#e3e6ea; --line-2:#eef0f3;
  --tx:#1b1f24; --tx-2:#5b6570; --tx-3:#8b959f;
  --accent:#2f6fd0; --accent-soft:#e8f0fb;
  --ok:#1f8a54; --ok-soft:#e6f4ec;
  --warn:#b3690a; --warn-soft:#fdf1de;
  --bad:#c0392b; --bad-soft:#fbeae8;
  --radius:10px;
  --mono:"Cascadia Mono",Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15181c; --panel:#1c2025; --panel-2:#20252b; --line:#2e343b; --line-2:#262b31;
    --tx:#e6e9ec; --tx-2:#a3adb7; --tx-3:#717b85;
    --accent:#63a0f0; --accent-soft:#1e2c40;
    --ok:#4cc38a; --ok-soft:#172b21;
    --warn:#e0a041; --warn-soft:#2e2517;
    --bad:#f0796b; --bad-soft:#33201e;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:13.5px; line-height:1.5;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}

/* ── 헤더 ───────────────────────── */
header{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
header .sub{color:var(--tx-3);font-size:12px}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--ok-soft);color:var(--ok);
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{
  border:1px solid var(--line);background:var(--panel-2);color:var(--tx);
  padding:6px 12px;border-radius:7px;font-weight:600;
}
.btn:hover{border-color:var(--tx-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}

/* ── 요약 타일 ───────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px}
.tile .k{font-size:11.5px;color:var(--tx-2);font-weight:600}
.tile .v{font-size:21px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.tile .v small{font-size:12px;font-weight:600;color:var(--tx-3);margin-left:3px}
.tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)} .tile.ok .v{color:var(--ok)}

/* ── 본문 레이아웃 ───────────────── */
main{display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:14px;padding:14px 18px 24px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card > .hd{
  display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line-2);
  font-weight:700;font-size:12.5px;background:var(--panel-2)
}
.card > .hd .cnt{color:var(--tx-3);font-weight:600}

/* ── 필터 ───────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px;border-bottom:1px solid var(--line-2)}
.filters select,.filters input{
  border:1px solid var(--line);background:var(--panel-2);color:var(--tx);
  padding:5px 8px;border-radius:6px;min-width:0
}
.filters input[type=search]{flex:1;min-width:110px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx-2);font-weight:600;cursor:pointer;user-select:none}

/* ── 집행건 목록 ─────────────────── */
.list{max-height:calc(100vh - 300px);overflow-y:auto}
@media (max-width:900px){.list{max-height:420px}}
.row{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;
  padding:10px 13px;border-bottom:1px solid var(--line-2);cursor:pointer;border-left:3px solid transparent
}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--accent-soft);border-left-color:var(--accent)}
.row .t{font-weight:600;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;white-space:nowrap}
.row .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;grid-column:1/-1;margin-top:2px}
.tag{
  display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700;
  background:var(--line-2);color:var(--tx-2)
}
.tag.no{font-family:var(--mono);font-weight:600;letter-spacing:-.3px}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
.badge.s-발생{background:var(--accent-soft);color:var(--accent)}
.badge.s-요구{background:var(--line-2);color:var(--tx-2)}
.badge.s-보완요청{background:var(--bad-soft);color:var(--bad)}
.badge.s-결의{background:var(--warn-soft);color:var(--warn)}
.badge.s-완료{background:var(--ok-soft);color:var(--ok)}
.ev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--tx-3);margin-left:auto}
.bar{width:44px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.part i{background:var(--warn)} .bar.none i{background:var(--bad)}
.empty{padding:34px 14px;text-align:center;color:var(--tx-3);font-size:12.5px}

/* ── 상세 ───────────────────────── */
.detail-hd{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.detail-hd .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.detail-hd h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.4px}
.detail-hd .amt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.kv{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:12px}
.kv div{display:flex;gap:6px}
.kv b{color:var(--tx-3);font-weight:600}

/* 날짜 흐름 */
.flow{display:flex;gap:0;padding:12px 16px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.step{flex:1;min-width:76px;position:relative;padding-right:8px}
.step:not(:last-child)::after{
  content:"";position:absolute;top:6px;right:2px;width:6px;height:6px;
  border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);transform:rotate(45deg)
}
.step .n{font-size:11px;font-weight:700;color:var(--tx-3)}
.step .d{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--tx-3);font-family:var(--mono)}
.step.done .n{color:var(--tx)} .step.done .d{color:var(--accent)}
.step.skip{opacity:.4}

.sec{padding:13px 16px;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
.sec > .sh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sec > .sh h3{margin:0;font-size:12.5px;font-weight:700}
.sec > .sh .note{font-size:11.5px;color:var(--tx-3)}

/* 폴더 */
.folder{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel-2);flex-wrap:wrap
}
.folder .path{font-family:var(--mono);font-size:12px;letter-spacing:-.3px;word-break:break-all;flex:1;min-width:150px}
.folder .path.none{color:var(--tx-3);font-family:inherit}

/* 체크리스트 */
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;border:1px solid transparent
}
.chip.have{background:var(--ok-soft);color:var(--ok)}
.chip.miss{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.chip.extra{background:var(--line-2);color:var(--tx-2)}

/* 파일 목록 */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-2);font-size:12px;vertical-align:middle}
th{font-size:11px;color:var(--tx-3);font-weight:700;background:var(--panel-2)}
td.n{font-family:var(--mono);font-size:11.5px;letter-spacing:-.3px;word-break:break-all}
td.sz{font-variant-numeric:tabular-nums;color:var(--tx-3);white-space:nowrap}
.newname{color:var(--ok);display:block;margin-top:2px}
.oldname{color:var(--tx-3);text-decoration:line-through}
.icon-btn{border:0;background:none;color:var(--tx-3);padding:2px 5px;border-radius:5px;font-size:14px;line-height:1}
.icon-btn:hover{background:var(--line-2);color:var(--bad)}

/* 드롭존 */
.drop{
  border:1.5px dashed var(--line);border-radius:9px;padding:18px 14px;text-align:center;
  color:var(--tx-3);background:var(--panel-2);transition:.15s
}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop .big{font-weight:700;color:var(--tx);font-size:13px}
.drop .hint{font-size:11.5px;margin-top:3px}
.uprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.uprow label{font-size:11.5px;font-weight:700;color:var(--tx-2)}
.uprow select{border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:5px 8px;border-radius:6px}

/* 증빙목록 출력 */
.out{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel-2)
}
.out code{flex:1;font-family:var(--mono);font-size:12px;word-break:break-all}
.out code.none{color:var(--tx-3);font-family:inherit}

/* 안내 */
.assume{margin:0 18px 24px;padding:11px 14px;border:1px solid var(--warn);border-left-width:3px;
  border-radius:8px;background:var(--warn-soft);font-size:12px;color:var(--tx)}
.assume b{color:var(--warn)}
.assume ul{margin:6px 0 0;padding-left:18px} .assume li{margin:2px 0}

/* 토스트 */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <h1>증빙 관리</h1>
  <span class="sub">2026_의료인공지능센터_회계대장 · 집행현황</span>
  <span class="spacer"></span>
  <span class="pill"><span class="dot"></span>시트 연결됨 <span style="font-weight:600;opacity:.8">(mock)</span></span>
  <button class="btn sm" onclick="toast('프로토타입: 실제 시트를 다시 읽지 않습니다')">↻ 새로고침</button>
</header>

<div class="tiles">
  <div class="tile"><div class="k">전체 집행건</div><div class="v" id="t-all">0</div></div>
  <div class="tile bad"><div class="k">증빙 미비</div><div class="v" id="t-miss">0<small>건</small></div></div>
  <div class="tile warn"><div class="k">폴더 미생성</div><div class="v" id="t-nofolder">0<small>건</small></div></div>
  <div class="tile ok"><div class="k">취합 완료</div><div class="v" id="t-done">0<small>건</small></div></div>
</div>

<main>
  <!-- 좌: 목록 -->
  <section class="card">
    <div class="hd">집행건 <span class="cnt" id="list-cnt"></span></div>
    <div class="filters">
      <select id="f-fund"><option value="">과제 전체</option></select>
      <select id="f-state"><option value="">상태 전체</option></select>
      <input type="search" id="f-q" placeholder="거래번호 · 적요 · 거래처">
      <label class="chk"><input type="checkbox" id="f-miss"> 증빙 미비만</label>
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- 우: 상세 -->
  <section class="card" id="detail"></section>
</main>

<div class="assume">
  <b>⚠ 가정한 값</b> — 스키마에 미정의된 항목을 임시로 채웠습니다. 확정되면 상수만 교체하면 됩니다.
  <ul>
    <li><b>상태</b>: 발생 / 요구 / 보완요청 / 결의 / 완료 (날짜 흐름에서 역산)</li>
    <li><b>증빙종류</b> 17종 및 <b>내역구분별 필수 증빙</b> 매핑 (<code>REQUIRED</code> 상수)</li>
    <li>파일 업로드·드라이브 반영·시트 쓰기는 동작하지 않습니다 (화면 내 상태만 변경)</li>
  </ul>
</div>

<div id="toast"></div>

<script>

    발생일:'2026-07-20', 요구일:'', 보완요청일:'', 보완완료일:'', 결의일:'', 완료일:'',
    folderId:null, 취합수행:false, files:[] },
  { no:6, 거래번호:'26-0006', 과제:'SPARK', 적요:'중간보고서 인쇄 30부', 거래처:'프린트나라',
    세세목:'인쇄제본비', 내역구분:'인쇄제본비', 결제수단:'계좌이체', 금액:315_000,
    발생일:'2026-07-22', 요구일:'2026-07-23', 보완요청일:'', 보완완료일:'', 결의일:'2026-07-28', 완료일:'',
    folderId:'1AbC_prt', 취합수행:true,
    files:[
      {t:'견적서',     size:98_000,  ext:'pdf', renamed:true},
      {t:'거래명세서', size:104_300, ext:'pdf', renamed:true},
      {t:'입금증',     size:61_200,  ext:'png', renamed:true},
    ]},
  { no:7, 거래번호:'26-0007', 과제:'AX', 적요:'추계학회 국내여비(서울-부산)', 거래처:'코레일',
    세세목:'국내여비', 내역구분:'국내여비', 결제수단:'개인선결제', 금액:428_600,
    발생일:'2026-07-24', 요구일:'2026-07-27', 보완요청일:'', 보완완료일:'', 결의일:'', 완료일:'',
    folderId:'1AbC_trv', 취합수행:false,
    files:[
      {t:'교통비영수증', size:55_400, ext:'pdf', renamed:false, raw:'ktx 영수증.pdf'},
    ]},
  { no:8, 거래번호:'26-0008', 과제:'공금', 적요:'사무용품 일괄 구매', 거래처:'오피스디포',
    세세목:'소모품비', 내역구분:'소모품비', 결제수단:'법인카드', 금액:87_400,
    발생일:'2026-07-28', 요구일:'', 보완요청일:'', 보완완료일:'', 결의일:'', 완료일:'',
    folderId:null, 취합수행:false, files:[] },
];

/* ══════════════════════════════════════════════
   파생 계산
   ══════════════════════════════════════════════ */
const won = n => '₩' + n.toLocaleString('ko-KR');
const kb  = n => n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.round(n/1024)+' KB';

/** 날짜 흐름에서 상태 역산 */
function stateOf(r){
  if(r.완료일) return '완료';
  if(r.결의일) return '결의';
  if(r.보완요청일 && !r.보완완료일) return '보완요청';
  if(r.요구일) return '요구';
  return '발생';
}
const reqOf   = r => REQUIRED[r.내역구분] || [];
const haveOf  = r => [...new Set(r.files.map(f=>f.t))];
const missOf  = r => reqOf(r).filter(t => !haveOf(r).includes(t));
const extraOf = r => haveOf(r).filter(t => !reqOf(r).includes(t));

/** 폴더명 규칙: 거래번호_재원_적요_금액 */
const folderName = r => [r.거래번호, r.과제, r.적요, r.금액].join('_');
/** 파일명 규칙: 거래번호_재원_적요_증빙종류_거래처_금액 */
const fileName = (r,f) => [r.거래번호, r.과제, r.적요, f.t, r.거래처, r.금액].join('_') + '.' + f.ext;

/* ══════════════════════════════════════════════
   목록 렌더
   ══════════════════════════════════════════════ */
let selected = ROWS[1].거래번호;

function initFilters(){
  const fund = document.getElementById('f-fund');
  [...new Set(ROWS.map(r=>r.과제))].forEach(v=>
    fund.insertAdjacentHTML('beforeend', `<option>${v}</option>`));
  const st = document.getElementById('f-state');
  STATES.forEach(v => st.insertAdjacentHTML('beforeend', `<option>${v}</option>`));
  ['f-fund','f-state','f-q','f-miss'].forEach(id =>
    document.getElementById(id).addEventListener('input', renderList));
}

function visibleRows(){
  const fund = document.getElementById('f-fund').value;
  const st   = document.getElementById('f-state').value;
  const q    = document.getElementById('f-q').value.trim().toLowerCase();
  const onlyMiss = document.getElementById('f-miss').checked;
  return ROWS.filter(r=>{
    if(fund && r.과제 !== fund) return false;
    if(st && stateOf(r) !== st) return false;
    if(onlyMiss && missOf(r).length === 0) return false;
    if(q && ![r.거래번호,r.적요,r.거래처].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderTiles(){
  document.getElementById('t-all').textContent      = ROWS.length;
  document.getElementById('t-miss').innerHTML       = ROWS.filter(r=>missOf(r).length).length + '<small>건</small>';
  document.getElementById('t-nofolder').innerHTML   = ROWS.filter(r=>!r.folderId).length + '<small>건</small>';
  document.getElementById('t-done').innerHTML       = ROWS.filter(r=>r.취합수행).length + '<small>건</small>';
}

function renderList(){
  const rows = visibleRows();
  document.getElementById('list-cnt').textContent = `${rows.length} / ${ROWS.length}`;
  const el = document.getElementById('list');
  if(!rows.length){ el.innerHTML = '<div class="empty">조건에 맞는 집행건이 없습니다.</div>'; return; }

  el.innerHTML = rows.map(r=>{
    const req = reqOf(r).length, have = req - missOf(r).length;
    const pct = req ? have/req*100 : 0;
    const cls = req===0 ? 'none' : have===req ? '' : have===0 ? 'none' : 'part';
    return `
    <div class="row ${r.거래번호===selected?'on':''}" data-id="${r.거래번호}">
      <div class="t">${r.적요}</div>
      <div class="amt">${won(r.금액)}</div>
      <div class="meta">
        <span class="tag no">${r.거래번호}</span>
        <span class="tag">${r.과제}</span>
        <span class="badge s-${stateOf(r)}">${stateOf(r)}</span>
        ${r.folderId ? '' : '<span class="tag" style="color:var(--warn)">폴더없음</span>'}
        <span class="ev">${have}/${req||'–'}
          <span class="bar ${cls}"><i style="width:${pct}%"></i></span>
        </span>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.row').forEach(n =>
    n.onclick = () => { selected = n.dataset.id; renderList(); renderDetail(); });
}

/* ══════════════════════════════════════════════
   상세 렌더
   ══════════════════════════════════════════════ */
function renderDetail(){
  const r = ROWS.find(x=>x.거래번호===selected);
  const el = document.getElementById('detail');
  if(!r){ el.innerHTML = '<div class="empty">좌측에서 집행건을 선택하세요.</div>'; return; }

  const steps = [
    ['발생(사용)', r.발생일], ['요구(등록)', r.요구일],
    ['보완요청', r.보완요청일], ['보완완료', r.보완완료일],
    ['지출결의', r.결의일], ['지출완료', r.완료일],
  ];
  const miss = missOf(r), have = haveOf(r), extra = extraOf(r);
  const list = have.length ? have.join(', ') : '';

  el.innerHTML = `
  <div class="detail-hd">
    <div class="top">
      <span class="tag no">${r.거래번호}</span>
      <span class="badge s-${stateOf(r)}">${stateOf(r)}</span>
      <span class="tag">${r.과제}</span>
      <span class="amt">${won(r.금액)}</span>
    </div>
    <h2>${r.적요}</h2>
    <div class="kv">
      <div><b>거래처</b>${r.거래처}</div>
      <div><b>세세목</b>${r.세세목}</div>
      <div><b>내역구분</b>${r.내역구분}</div>
      <div><b>결제수단</b>${r.결제수단}</div>
    </div>
  </div>

  <div class="flow">
    ${steps.map(([n,d])=>`
      <div class="step ${d?'done':'skip'}">
        <div class="n">${n}</div>
        <div class="d">${d ? d.slice(2).replace(/-/g,'. ') : '–'}</div>
      </div>`).join('')}
  </div>

  <div class="sec">
    <div class="sh"><h3>증빙 폴더</h3><span class="note">폴더명 규칙: 거래번호_재원_적요_금액</span></div>
    <div class="folder">
      ${r.folderId
        ? `<span style="color:var(--accent)">📁</span>
           <span class="path">${DRIVE_ROOT}/${folderName(r)}</span>
           <button class="btn sm" onclick="toast('프로토타입: 드라이브 폴더를 새 탭에서 엽니다')">드라이브에서 열기 ↗</button>`
        : `<span style="color:var(--warn)">⚠</span>
           <span class="path none">폴더가 아직 생성되지 않았습니다 · 생성 시 <code>집행현황[증빙서류]</code>에 주소가 기입됩니다</span>
           <button class="btn primary sm" onclick="makeFolder('${r.거래번호}')">폴더 생성</button>`}
    </div>
  </div>

  <div class="sec">
    <div class="sh">
      <h3>필수 증빙 체크</h3>
      <span class="note">${r.내역구분} 기준 ${reqOf(r).length}종</span>
      ${miss.length
        ? `<span class="badge s-보완요청" style="margin-left:auto">${miss.length}종 누락</span>`
        : `<span class="badge s-완료" style="margin-left:auto">충족</span>`}
    </div>
    <div class="checks">
      ${reqOf(r).map(t=>`<span class="chip ${have.includes(t)?'have':'miss'}">${have.includes(t)?'✓':'✗'} ${t}</span>`).join('')}
      ${extra.map(t=>`<span class="chip extra">+ ${t}</span>`).join('')}
      ${reqOf(r).length ? '' : '<span class="note" style="color:var(--tx-3)">해당 내역구분의 필수 증빙 매핑이 정의되지 않았습니다.</span>'}
    </div>
  </div>

  <div class="sec">
    <div class="sh">
      <h3>파일 <span class="cnt" style="color:var(--tx-3)">${r.files.length}</span></h3>
      <span class="note">파일명 규칙: 거래번호_재원_적요_증빙종류_거래처_금액</span>
      <button class="btn sm ${r.취합수행?'':'primary'}" style="margin-left:auto"
        ${r.files.length?'':'disabled'} onclick="collect('${r.거래번호}')">
        ${r.취합수행 ? '↻ 재취합' : '취합 수행'}
      </button>
    </div>
    ${r.files.length ? `
    <table>
      <thead><tr><th style="width:96px">증빙종류</th><th>파일명</th><th style="width:64px">크기</th><th style="width:32px"></th></tr></thead>
      <tbody>
        ${r.files.map((f,i)=>`
        <tr>
          <td><span class="tag">${f.t}</span></td>
          <td class="n">
            ${f.renamed
              ? fileName(r,f)
              : `<span class="oldname">${f.raw}</span><span class="newname">→ ${fileName(r,f)}</span>`}
          </td>
          <td class="sz">${kb(f.size)}</td>
          <td><button class="icon-btn" title="삭제" onclick="delFile('${r.거래번호}',${i})">×</button></td>
        </tr>`).join('')}
      </tbody>
    </table>` : '<div class="empty" style="padding:18px">업로드된 파일이 없습니다.</div>'}
  </div>

  <div class="sec">
    <div class="sh"><h3>증빙 업로드</h3><span class="note">선택한 증빙종류로 파일명이 자동 조립됩니다</span></div>
    <div class="uprow">
      <label for="up-type">증빙종류</label>
      <select id="up-type">
        ${EVIDENCE_TYPES.map(t=>`<option ${miss[0]===t?'selected':''}>${t}</option>`).join('')}
      </select>
      ${miss.length ? `<span class="note" style="color:var(--bad);font-weight:700">누락: ${miss.join(', ')}</span>` : ''}
    </div>
    <div class="drop" id="drop">
      <div class="big">파일을 여기로 끌어다 놓으세요</div>
      <div class="hint">또는 <a href="#" onclick="document.getElementById('picker').click();return false"
        style="color:var(--accent);font-weight:700">찾아보기</a> · 모바일에서는 카메라로 바로 촬영 · 파일당 20MB 이하</div>
      <input type="file" id="picker" multiple hidden>
    </div>
  </div>

  <div class="sec">
    <div class="sh"><h3>증빙목록 출력</h3><span class="note">집행현황[증빙목록] 셀에 기입되는 값</span></div>
    <div class="out">
      <code class="${list?'':'none'}">${list || '(증빙 없음)'}</code>
      <button class="btn sm" ${list?'':'disabled'} onclick="copyOut('${list}')">복사</button>
    </div>
  </div>`;

  bindDrop(r);
}

/* ══════════════════════════════════════════════
   동작 (프로토타입: 화면 상태만 변경)
   ══════════════════════════════════════════════ */
function makeFolder(id){
  const r = ROWS.find(x=>x.거래번호===id);
  r.folderId = 'mock_' + id;
  toast(`폴더 생성: ${folderName(r)}`);
  refresh();
}

function collect(id){
  const r = ROWS.find(x=>x.거래번호===id);
  const n = r.files.filter(f=>!f.renamed).length;
  r.files.forEach(f=>{ f.renamed = true; });
  r.취합수행 = true;
  toast(n ? `${n}개 파일명 변환 · 증빙목록 갱신` : '증빙목록 갱신');
  refresh();
}

function delFile(id, i){
  const r = ROWS.find(x=>x.거래번호===id);
  r.files.splice(i,1);
  toast('파일 삭제 (프로토타입: 드라이브에는 반영되지 않음)');
  refresh();
}

function addFiles(r, fileList){
  const type = document.getElementById('up-type').value;
  [...fileList].forEach(f=>{
    const ext = (f.name.split('.').pop() || 'bin').toLowerCase();
    r.files.push({ t:type, size:f.size, ext, renamed:false, raw:f.name });
  });
  toast(`${fileList.length}개 파일 추가 (${type}) · 프로토타입이라 업로드는 되지 않습니다`);
  refresh();
}

function bindDrop(r){
  const dz = document.getElementById('drop');
  const pk = document.getElementById('picker');
  ['dragenter','dragover'].forEach(e => dz.addEventListener(e, ev=>{
    ev.preventDefault(); dz.classList.add('hot');
  }));
  ['dragleave','drop'].forEach(e => dz.addEventListener(e, ()=> dz.classList.remove('hot')));
  dz.addEventListener('drop', ev=>{
    ev.preventDefault();
    if(ev.dataTransfer.files.length) addFiles(r, ev.dataTransfer.files);
  });
  pk.addEventListener('change', ()=>{ if(pk.files.length) addFiles(r, pk.files); });
}

function copyOut(s){
  navigator.clipboard?.writeText(s);
  toast('증빙목록 복사됨');
}

let tid;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tid); tid = setTimeout(()=>t.classList.remove('on'), 2400);
}

function refresh(){ renderTiles(); renderList(); renderDetail(); }

initFilters();
refresh();
</script>
</body>
</html>
