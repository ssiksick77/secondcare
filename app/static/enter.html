<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시작 · SECONDCare</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body enter-body">
<a class="skip" href="#main">본문 바로가기</a>

<header class="top">
  <span class="top-user" id="top-user" title="로그인 계정"></span>
  <button type="button" class="btn btn-ghost" id="btn-logout">로그아웃</button>
</header>

<main id="main" class="enter-main">
  <h1 class="enter-mark" id="enter-title"><span class="enter-mark-a">SECOND</span><span class="enter-mark-b">Care</span><small>의료인공지능센터 연구비 관리 시스템</small></h1>
  <nav class="enter-menu" aria-labelledby="enter-title">
    <a class="enter-btn" href="/fund" data-home="fund">
      <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="6" width="32" height="36" rx="1"/><path d="M15 6v36"/><path d="M21 15h13M21 22h13M21 29h13M21 36h8"/>
      </svg>
      <span>연구비</span>
    </a>
    <a class="enter-btn" href="/labor" data-home="labor">
      <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="16" r="6"/><path d="M6 40v-4a10 10 0 0 1 10-10h4a10 10 0 0 1 10 10v4"/><circle cx="33" cy="18" r="5"/><path d="M34 26a9 9 0 0 1 9 9v5"/>
      </svg>
      <span>인건비</span>
    </a>
    <a class="enter-btn" href="/request" data-home="request">
      <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6h17l9 9v27H12z"/><path d="M29 6v9h9"/><path d="M24 20v14M17 27h14"/>
      </svg>
      <span>신청</span>
    </a>
  </nav>
  <p class="login-note enter-note">설정의 "기본 화면"에서 로그인 뒤 바로 들어갈 화면을 고를 수 있습니다.</p>
</main>

<footer class="login-foot">
  <small>분당서울대학교병원 의료인공지능센터</small>
</footer>

<script>
(async function () {
  var HOME_PATHS = { fund: "/fund", labor: "/labor", request: "/request" };
  var stay = new URLSearchParams(location.search).has("menu");
  var me = {};
  try { me = await (await fetch("/api/me")).json(); } catch (e) { }
  if (me && me.email) {
    var u = document.getElementById("top-user");
    u.textContent = me.name || me.email; u.title = "로그인 계정: " + me.email;
  }
  // 기본 화면: 서버(SQLite)가 비어 있으면 브라우저 기억(xlsx 모드)
  var home = (me && me.home) || "";
  if (!home) { try { home = localStorage.getItem("ledger-home") || ""; } catch (e) { } }
  if (!stay && HOME_PATHS[home]) { if (home === "request") rememberAdmin(); location.replace(HOME_PATHS[home]); return; }
  // 신청: 연구원이 아니면 담당자 모드로 (주소 / 직접 접속은 연구원 화면)
  function rememberAdmin() {
    if (me && me.role && me.role !== "researcher") { try { sessionStorage.setItem("request-admin", "1"); } catch (e) { } }
  }
  document.querySelector(".enter-btn[data-home=request]").addEventListener("click", rememberAdmin);
  document.getElementById("btn-logout").addEventListener("click", async function () {
    try { await fetch("/auth/logout", { method: "POST" }); } catch (e) { }
    location.href = "/login";
  });
})();
</script>
</body>
</html>
