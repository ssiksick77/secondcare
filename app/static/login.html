<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · SECONDCare</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<a class="skip" href="#main">본문 바로가기</a>

<header class="top">
  <h1><span class="app-name">SECONDCare</span><small class="app-full">의료인공지능센터 연구비 관리 시스템</small></h1>
</header>

<main id="main" class="login-main">
  <section class="login-card" aria-labelledby="login-title">
    <h2 id="login-title">로그인</h2>
    <p class="login-hint">센터 담당자가 등록한 Google 계정으로 들어갈 수 있습니다.</p>
    <div class="alert error login-alert" id="login-alert" role="alert" aria-live="assertive" hidden></div>
    <a class="btn btn-primary login-btn" id="btn-google" href="/auth/login">Google 계정으로 로그인</a>
    <p class="login-note">로그인 상태는 이 브라우저에서 30일 동안 유지됩니다.</p>
  </section>
</main>

<footer class="login-foot">
  <small>분당서울대학교병원 의료인공지능센터 · 연구비 지출장부</small>
</footer>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var err = q.get("err");
  if (!err) return;
  var box = document.getElementById("login-alert");
  var msg = q.get("msg") || "";
  var text;
  if (err === "denied") {
    text = "허용되지 않은 계정입니다" + (q.get("email") ? " (" + q.get("email") + ")" : "") + ". 담당자에게 이 이메일의 등록을 요청하세요.";
  } else if (err === "config") {
    text = "로그인 설정이 아직 없습니다. " + (msg || "README 의 '구글 로그인 설정'을 보세요.");
  } else if (err === "cancel") {
    text = "로그인이 취소되었습니다. 다시 시도하세요.";
  } else {
    text = "로그인이 완료되지 않았습니다. 다시 시도하세요." + (msg ? " (" + msg + ")" : "");
  }
  box.textContent = text;
  box.hidden = false;
})();
</script>
</body>
</html>
