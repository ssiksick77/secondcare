<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증빙 첨부 E3</title>
<style>
@page { size: A4 portrait; margin: 15mm; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #E5E7EB; color: #000;
  font-family: "Pretendard GOV", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  font-size: 10.5pt; line-height: 1.45;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
/* 화면: A4 한 장, 안쪽 15mm. 내용 칸 높이 267mm 를 세로 flex 로 나눠 부착란이 남은 높이를 채운다 */
.sheet {
  width: 210mm; height: 297mm; margin: 24px auto; padding: 15mm;
  background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
.content { height: 100%; display: flex; flex-direction: column; }

:root { --row: 8mm; --pad: 3mm; --label: 24mm; --label-bg: #F2F2F2; }

/* 머리: 기관명 한 줄 */
.inst { flex: none; font-size: 10pt; color: #333; margin: 0; line-height: 1.45; }

/* 증빙 정보 3행. 열 격자 24·36·4·20·4·32·24·36 (=180mm)
   1행: 증빙번호 36 | 증빙종류 36 | 금액 36
   2행: 거래처 40 | 적요 92
   3행: 비고 156 */
table.f { flex: none; width: 100%; margin-top: 4mm; border-collapse: collapse; table-layout: fixed; border: 1px solid #000; background: #fff; }
table.f th, table.f td {
  border: 0.5pt solid #000; height: var(--row); padding: 0 2mm 0 var(--pad);
  text-align: left; vertical-align: middle; line-height: 1.3; letter-spacing: 0; white-space: nowrap;
}
table.f th {
  font-weight: 600; color: #333; background: var(--label-bg);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
table.f td { overflow: hidden; text-overflow: ellipsis; }
table.f .no { font-weight: 700; }
table.f .num { text-align: right; padding: 0 2mm; }
table.f col.c1 { width: 24mm; }
table.f col.c2 { width: 36mm; }
table.f col.c3 { width: 4mm; }
table.f col.c4 { width: 20mm; }
table.f col.c5 { width: 4mm; }
table.f col.c6 { width: 32mm; }
table.f col.c7 { width: 24mm; }
table.f col.c8 { width: 36mm; }

/* 부착란: 테두리만, 남은 높이를 채움 */
.mount { flex: 1 1 auto; min-height: 0; margin-top: 4mm; border: 1px solid #000; }

@media print {
  body { background: #fff; }
  /* 인쇄: 내용 칸 = 297 - 30 = 267mm. 반올림 넘침을 막으려고 1mm 덜 잡는다 */
  .sheet { width: auto; height: 266mm; margin: 0; padding: 0; box-shadow: none; }
  body, body * { font-feature-settings: normal; font-variant-numeric: normal; }
}
</style>
</head>
<body>
<main class="sheet">
  <div class="content">
    <p class="inst">분당서울대학교병원 의료인공지능센터</p>

    <table class="f">
      <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"><col class="c7"><col class="c8"></colgroup>
      <tbody>
        <tr>
          <th scope="row">증빙번호</th><td class="no">2026-0147-3</td>
          <th scope="row" colspan="2">증빙종류</th><td colspan="2">카드전표</td>
          <th scope="row">금액</th><td class="num">385,000원</td>
        </tr>
        <tr>
          <th scope="row">거래처</th><td colspan="2">(주)메디컬프린팅</td>
          <th scope="row" colspan="2">적요</th><td colspan="3">자문회의 자료 인쇄 및 제본 (30부)</td>
        </tr>
        <tr>
          <th scope="row">비고</th><td colspan="7">원본 보관</td>
        </tr>
      </tbody>
    </table>

    <section class="mount" aria-label="실물 증빙 부착란"></section>
  </div>
</main>
</body>
</html>
