<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증빙 첨부 E1</title>
<style>
@page {
  size: A4 portrait; margin: 15mm;
  @bottom-center { content: counter(page) "/" counter(pages); font-size: 9pt; color: #000; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #E5E7EB; color: #000;
  font-family: "Pretendard GOV", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  font-size: 10.5pt; line-height: 1.45;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
/* 화면: A4 한 장, 안쪽 15mm. 내용 칸 높이 267mm 를 세로 flex 로 나눠 부착란이 남은 높이를 채운다 */
.sheet {
  position: relative;
  width: 210mm; height: 297mm; margin: 24px auto; padding: 15mm;
  background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
.content { height: 100%; display: flex; flex-direction: column; }
.pageno {
  position: absolute; left: 0; right: 0; bottom: 0; height: 15mm;
  display: flex; align-items: center; justify-content: center;
  font-size: 9pt; line-height: 1;
}

:root { --row: 8mm; --pad: 3mm; --label: 24mm; --label-bg: #F2F2F2; }

.box th, table.f th {
  background: var(--label-bg);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

/* 머리: 지출결의서와 같은 구성 */
.head { position: relative; flex: none; }
.inst { font-size: 10pt; color: #333; margin: 0; line-height: 1.45; }
.title-band { height: 18mm; display: flex; align-items: center; justify-content: center; margin-top: 2mm; }
h1 { margin: 0; text-align: center; font-size: 22pt; font-weight: 700; letter-spacing: 0; line-height: 1.2; }
.box { position: absolute; top: 0; right: 0; width: 52mm; border-collapse: collapse; table-layout: fixed; font-size: 10pt; background: #fff; }
.box th, .box td { border: 0.5pt solid #000; height: var(--row); padding: 0 2mm 0 var(--pad); text-align: left; vertical-align: middle; font-weight: 400; white-space: nowrap; line-height: 1.2; }
.box th { color: #333; width: 20mm; }
.box .no { font-weight: 700; }
.title-rule { flex: none; border: 0; border-top: 3px double #000; margin: 0; }

/* 1단: 증빙 정보 한 줄 */
table.f { flex: none; width: 100%; margin-top: 6mm; border-collapse: collapse; table-layout: fixed; border: 1px solid #000; background: #fff; }
table.f th, table.f td {
  border: 0.5pt solid #000; height: var(--row); padding: 0 2mm 0 var(--pad);
  text-align: left; vertical-align: middle; line-height: 1.3; letter-spacing: 0; white-space: nowrap;
}
table.f th { font-weight: 600; color: #333; }
table.f col.l { width: var(--label); }
table.f .no { font-weight: 700; }

/* 2단: 부착란. 테두리만, 남은 높이를 채움 */
.mount { flex: 1 1 auto; min-height: 0; margin-top: 4mm; border: 1px solid #000; position: relative; }
.mount .cap { position: absolute; top: 2mm; left: var(--pad); margin: 0; font-size: 9pt; line-height: 1; color: #666; }

@media print {
  body { background: #fff; }
  /* 인쇄: 내용 칸 = 297 - 30 = 267mm. 반올림 넘침을 막으려고 1mm 덜 잡는다 */
  .sheet { width: auto; height: 266mm; margin: 0; padding: 0; box-shadow: none; }
  .pageno { display: none; }
  body, body * { font-feature-settings: normal; font-variant-numeric: normal; }
}
</style>
</head>
<body>
<main class="sheet">
  <div class="content">
    <header class="head">
      <p class="inst">분당서울대학교병원 의료인공지능센터</p>
      <table class="box">
        <tr><th scope="row">거래번호</th><td class="no">2026-0147</td></tr>
        <tr><th scope="row">담당자</th><td>안윤아</td></tr>
      </table>
      <div class="title-band">
        <h1>증빙 첨부</h1>
      </div>
    </header>
    <hr class="title-rule">

    <table class="f">
      <colgroup><col class="l"><col><col class="l"><col><col class="l"><col></colgroup>
      <tbody>
        <tr>
          <th scope="row">증빙번호</th><td class="no">2026-0147-3</td>
          <th scope="row">증빙종류</th><td>카드전표</td>
          <th scope="row">비고</th><td>원본 보관</td>
        </tr>
      </tbody>
    </table>

    <section class="mount" aria-label="실물 증빙 부착란">
      <p class="cap">실물 증빙 부착란</p>
    </section>
  </div>
  <div class="pageno" aria-hidden="true">1/1</div>
</main>
</body>
</html>
